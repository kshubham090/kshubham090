<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Shubham Gupta — Software engineer</title>
  <desc id="description">A charcoal, grey, and blue terminal-inspired profile banner. AI systems, full-stack products, and a simple loop: build, inspect, improve. Python and Java.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#253142"/>
    </pattern>
    <clipPath id="window">
      <rect x="1" y="1" width="1118" height="418" rx="20"/>
    </clipPath>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1L5 3.5L1 6" stroke="#718399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g clip-path="url(#window)">
    <rect width="1120" height="420" fill="#0C1118"/>
    <rect x="724" y="45" width="396" height="320" fill="url(#grid)"/>
    <rect width="1120" height="45" fill="#171F2A"/>
    <path d="M0 45H1120" stroke="#2D3949"/>
    <circle cx="25" cy="23" r="5" fill="#526173"/>
    <circle cx="44" cy="23" r="5" fill="#8491A1"/>
    <circle cx="63" cy="23" r="5" fill="#BAC3CF"/>
    <g font-family="Outfit, sans-serif">
      <text x="92" y="28" font-size="12" fill="#A8B4C4">shubham@github: ~/work</text>
      <text x="1033" y="28" font-size="11" fill="#A8B4C4">README.md</text>
      <text x="52" y="97" font-size="12" letter-spacing="2" fill="#85B9FF">SOFTWARE / AI SYSTEMS</text>
      <text x="49" y="178" font-family="Raleway, sans-serif" font-size="58" font-weight="700" letter-spacing="-2" fill="#EDF2F8">Shubham<tspan dx="18" fill="#85B9FF">Gupta.</tspan></text>
      <text x="52" y="223" font-size="23" fill="#EDF2F8">Software engineer.</text>
      <text x="52" y="257" font-size="19" fill="#A8B4C4">AI systems. Full-stack products.</text>
      <text x="52" y="327" font-size="18" fill="#85B9FF">&gt;<tspan dx="12" fill="#EDF2F8">build. inspect. improve.</tspan><tspan dx="12" fill="#85B9FF">_</tspan></text>
      <path d="M52 355H1068" stroke="#2D3949"/>
      <text x="52" y="389" font-size="13" fill="#A8B4C4">PYTHON<tspan dx="28" fill="#718399">/</tspan><tspan dx="28" fill="#A8B4C4">JAVA</tspan></text>
      <text x="948" y="389" font-size="13" fill="#85B9FF">shubham.cv</text>
      <text x="812" y="91" font-size="11" letter-spacing="1.5" fill="#A8B4C4">THE FEEDBACK LOOP</text>
      <rect x="801" y="111" width="230" height="49" rx="6" fill="#131D2A" stroke="#3C506B"/>
      <text x="916" y="142" text-anchor="middle" font-size="17" fill="#85B9FF">{ idea }</text>
      <path d="M916 161V185" stroke="#718399" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="801" y="193" width="230" height="49" rx="6" fill="#131D2A" stroke="#3C506B"/>
      <text x="916" y="224" text-anchor="middle" font-size="17" fill="#EDF2F8">[ code + tests ]</text>
      <path d="M916 243V267" stroke="#718399" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="801" y="275" width="230" height="49" rx="6" fill="#131D2A" stroke="#3C506B"/>
      <text x="916" y="306" text-anchor="middle" font-size="17" fill="#85B9FF">&lt; feedback &gt;</text>
      <path d="M1032 299H1059V136H1039" stroke="#718399" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
