      <text x="52" y="257" font-size="19" fill="#A7B6AB">AI systems. Full-stack products.</text>
      <text x="52" y="327" font-size="18" fill="#C1F17E">&gt;<tspan dx="12" fill="#EBEEE5">build. inspect. improve.</tspan><tspan dx="12" fill="#C1F17E">_</tspan></text>
