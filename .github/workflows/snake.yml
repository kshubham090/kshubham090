name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: kshubham090
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#60a5fa,#ededeb&color_dots=#161616,#1e3a5f,#2c5f8f,#3f82c0,#60a5fa&color_empty=#161616

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
